name: Guidra CI

on:
  push:
    branches:
      - main

jobs:
  lint:
    name: Lint Frontend and Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Lint client
        working-directory: client
        run: npm run lint

      - name: Lint server
        working-directory: server
        run: npm run lint

  test:
    name: Test Backend via Docker Compose
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run tests inside Docker Compose
        env:
          PORT: ${{ secrets.PORT }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
        run: |
          docker compose -f docker-compose.test.yml up --build --exit-code-from server-test

  publish-AWS-ECR:
    name: Build and publish Docker images
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    outputs:
      ecr_registry: ${{ steps.login-ecr.outputs.registry }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/mrtuxcoder/guidra-backend:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/mrtuxcoder/guidra-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/mrtuxcoder/guidra-frontend:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/mrtuxcoder/guidra-frontend:latest

  publish-GHCR:
    name: Build and publish Docker images to GitHub Container Registry
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ghcr.io/mrtuxcoder/guidra-backend:${{ github.sha }}
            ghcr.io/mrtuxcoder/guidra-backend:latest

      - name: Build and push frontend image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          tags: |
            ghcr.io/mrtuxcoder/guidra-frontend:${{ github.sha }}
            ghcr.io/mrtuxcoder/guidra-frontend:latest

  deploy-to-ec2:
    name: Deploy via Direct AWS SSM Run Command
    needs: publish-AWS-ECR
    runs-on: ubuntu-latest
    strategy:
      matrix:
        instance_id:
          - ${{ vars.EC2_INSTANCE_ID_1 }}
          - ${{ vars.EC2_INSTANCE_ID_2 }}

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Execute Production Deploy via AWS SSM API
        run: |
          REGISTRY_URI="${{ needs.publish-AWS-ECR.outputs.ecr_registry }}"
          AWS_REGION="${{ secrets.AWS_REGION }}"

          aws ssm send-command \
            --instance-ids "${{ matrix.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploying Guidra Production Stack via ECR" \
            --parameters commands="[
              \"cd /opt/guidra\",
              \"aws ecr get-login-password --region $AWS_REGION | sudo docker login --username AWS --password-stdin $REGISTRY_URI\",
              \"sudo docker compose --env-file .env.production -f docker-compose.yml -f docker-compose.prod.yml pull\",
              \"sudo docker compose --env-file .env.production -f docker-compose.yml -f docker-compose.prod.yml up -d\",
              \"sudo docker system prune -af\"
            ]" \
            --query "Command.CommandId"
