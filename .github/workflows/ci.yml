name: Guidra CI

on:
  push:
    branches:
        - main

jobs:
  lint:
    name: Lint Frontend and Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Lint client
        working-directory: client
        run: npm run lint

      - name: Lint server
        working-directory: server
        run: npm run lint

  test:
    name: Test Backend via Docker Compose
    runs-on: ubuntu-latest
    needs: lint 

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      
      - name: Run tests inside Docker Compose
        env:
          PORT: ${{ secrets.PORT }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
        run: |
          docker compose -f docker-compose.test.yml up --build --exit-code-from server-test

  publish:
    name: Build and publish Docker images
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Handle repository owner casing
        id: repo_info
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner_lower=${OWNER_LOWER}" >> $GITHUB_OUTPUT

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ghcr.io/${{ steps.repo_info.outputs.owner_lower }}/guidra-backend:${{ github.sha }}
            ghcr.io/${{ steps.repo_info.outputs.owner_lower }}/guidra-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          tags: |
            ghcr.io/${{ steps.repo_info.outputs.owner_lower }}/guidra-frontend:${{ github.sha }}
            ghcr.io/${{ steps.repo_info.outputs.owner_lower }}/guidra-frontend:latest
