
name: Guidra Rollback

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Full Git commit SHA of the release to restore"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: guidra-production-deployment
  cancel-in-progress: false

jobs:
  rollback:
    name: Rollback Guidra Production
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Validate release SHA
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid release SHA. Enter a full 40-character lowercase Git SHA."
            exit 1
          fi

      - name: Verify ECR images exist
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          aws ecr describe-images \
            --repository-name mrtuxcoder/guidra-backend \
            --image-ids imageTag="$RELEASE_SHA"

          aws ecr describe-images \
            --repository-name mrtuxcoder/guidra-frontend \
            --image-ids imageTag="$RELEASE_SHA"

          echo "Both images are available. Proceeding with rollback."

      - name: Rollback both EC2 instances through SSM
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          INSTANCE_1: ${{ vars.EC2_INSTANCE_ID_1 }}
          INSTANCE_2: ${{ vars.EC2_INSTANCE_ID_2 }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          if [[ -z "$INSTANCE_1" || -z "$INSTANCE_2" ]]; then
            echo "EC2 instance IDs are missing."
            exit 1
          fi

          if [[ -z "${AWS_ACCOUNT_ID:-}" ]]; then
            AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          fi

          REGISTRY="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"

          BACKEND_IMAGE="$REGISTRY/mrtuxcoder/guidra-backend:$RELEASE_SHA"
          FRONTEND_IMAGE="$REGISTRY/mrtuxcoder/guidra-frontend:$RELEASE_SHA"

          COMMANDS=$(jq -n \
            --arg region "$AWS_REGION" \
            --arg registry "$REGISTRY" \
            --arg backend "$BACKEND_IMAGE" \
            --arg frontend "$FRONTEND_IMAGE" \
            --arg commit "$RELEASE_SHA" \
            '{
              commands: [
                "set -e",
                "cd /opt/guidra",

                ("curl -f -sSL https://raw.githubusercontent.com/mrtuxcoder/Guidra-learning-platform/" + $commit + "/docker-compose.yml -o docker-compose.yml"),
                ("curl -f -sSL https://raw.githubusercontent.com/mrtuxcoder/Guidra-learning-platform/" + $commit + "/docker-compose.prod.yml -o docker-compose.prod.yml"),

                ("aws ecr get-login-password --region " + $region + " | docker login --username AWS --password-stdin " + $registry),

                ("grep -q \"^BACKEND_IMAGE=\" .env.production && sed -i \"s|^BACKEND_IMAGE=.*|BACKEND_IMAGE=" + $backend + "|\" .env.production || echo \"BACKEND_IMAGE=" + $backend + "\" >> .env.production"),

                ("grep -q \"^FRONTEND_IMAGE=\" .env.production && sed -i \"s|^FRONTEND_IMAGE=.*|FRONTEND_IMAGE=" + $frontend + "|\" .env.production || echo \"FRONTEND_IMAGE=" + $frontend + "\" >> .env.production"),

                "docker compose --env-file .env.production -f docker-compose.yml -f docker-compose.prod.yml pull",

                "docker compose --env-file .env.production -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans",

                "docker inspect -f \"{{.State.Running}}\" guidra-prod-server | grep -qx true",
                "docker inspect -f \"{{.State.Running}}\" guidra-prod-client | grep -qx true",

                "echo \"Rollback completed. Both containers are running.\""
              ]
            }')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_1" "$INSTANCE_2" \
            --document-name "AWS-RunShellScript" \
            --comment "Rollback Guidra to $RELEASE_SHA" \
            --parameters "$COMMANDS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for INSTANCE_ID in "$INSTANCE_1" "$INSTANCE_2"; do
            echo "Waiting for rollback on $INSTANCE_ID..."

            while true; do
              STATUS=$(aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "Status" \
                --output text 2>/dev/null || echo "Pending")

              case "$STATUS" in
                Success)
                  echo "$INSTANCE_ID rollback successful."
                  break
                  ;;
                Failed|Cancelled|TimedOut|Undeliverable|Terminated)
                  echo "$INSTANCE_ID rollback failed: $STATUS"
                  aws ssm get-command-invocation \
                    --command-id "$COMMAND_ID" \
                    --instance-id "$INSTANCE_ID"
                  exit 1
                  ;;
                *)
                  echo "Current status: $STATUS"
                  sleep 5
                  ;;
              esac
            done
          done

      - name: Rollback summary
        run: |
          echo "Guidra rollback workflow completed."
          echo "Restored release: ${{ inputs.release_sha }}"
