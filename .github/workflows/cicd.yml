
name: Guidra CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # --------------------------------------------------
  # 1. LINT
  # --------------------------------------------------
  lint:
    name: Lint Frontend and Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Lint client
        working-directory: client
        run: npm run lint

      - name: Lint server
        working-directory: server
        run: npm run lint

  # --------------------------------------------------
  # 2. TEST
  # --------------------------------------------------
  test:
    name: Test Backend
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run backend tests
        env:
          PORT: ${{ secrets.PORT }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
        run: |
          docker compose -f docker-compose.test.yml up \
            --build \
            --exit-code-from server-test

      - name: Clean up test containers
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  # --------------------------------------------------
  # 3. PUBLISH TO AWS ECR
  # --------------------------------------------------
  publish-ecr:
    name: Build and Publish Images to AWS ECR
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read
      id-token: write

    outputs:
      registry: ${{ steps.login-ecr.outputs.registry }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/mrtuxcoder/guidra-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/mrtuxcoder/guidra-frontend:${{ github.sha }}

  # --------------------------------------------------
  # 4. PUBLISH TO GHCR
  # --------------------------------------------------
  publish-ghcr:
    name: Build and Publish Images to GHCR
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ghcr.io/mrtuxcoder/guidra-backend:${{ github.sha }}
            ghcr.io/mrtuxcoder/guidra-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          tags: |
            ghcr.io/mrtuxcoder/guidra-frontend:${{ github.sha }}
            ghcr.io/mrtuxcoder/guidra-frontend:latest

  # --------------------------------------------------
  # 5. DEPLOY TO EC2
  # --------------------------------------------------
  deploy:
    name: Deploy Release to EC2
    runs-on: ubuntu-latest
    needs: publish-ecr

    concurrency:
      group: guidra-production-deployment
      cancel-in-progress: false

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Verify both immutable images exist before deployment.
      - name: Validate ECR images
        env:
          REGISTRY: ${{ needs.publish-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ -z "$REGISTRY" ]]; then
            echo "ECR registry output is empty."
            exit 1
          fi

          echo "Registry: $REGISTRY"
          echo "Release: $IMAGE_TAG"

          aws ecr describe-images \
            --repository-name mrtuxcoder/guidra-backend \
            --image-ids imageTag="$IMAGE_TAG"

          aws ecr describe-images \
            --repository-name mrtuxcoder/guidra-frontend \
            --image-ids imageTag="$IMAGE_TAG"

      # Deploy the exact same release to both EC2 instances.
      - name: Deploy to EC2 through SSM
        env:
          REGISTRY: ${{ needs.publish-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          INSTANCE_1: ${{ vars.EC2_INSTANCE_ID_1 }}
          INSTANCE_2: ${{ vars.EC2_INSTANCE_ID_2 }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$INSTANCE_1" || -z "$INSTANCE_2" ]]; then
            echo "EC2 instance IDs are missing."
            exit 1
          fi

          BACKEND_IMAGE="$REGISTRY/mrtuxcoder/guidra-backend:$IMAGE_TAG"
          FRONTEND_IMAGE="$REGISTRY/mrtuxcoder/guidra-frontend:$IMAGE_TAG"

          echo "Deploying release: $IMAGE_TAG"
          echo "Backend: $BACKEND_IMAGE"
          echo "Frontend: $FRONTEND_IMAGE"

          # Build the remote deployment script.
          REMOTE_SCRIPT=$(cat <<EOF
          set -euo pipefail

          cd /opt/guidra

          echo "Downloading Compose files for release $IMAGE_TAG"

          curl -f -sSL \
            https://raw.githubusercontent.com/mrtuxcoder/Guidra-learning-platform/$IMAGE_TAG/docker-compose.yml \
            -o docker-compose.yml

          curl -f -sSL \
            https://raw.githubusercontent.com/mrtuxcoder/Guidra-learning-platform/$IMAGE_TAG/docker-compose.prod.yml \
            -o docker-compose.prod.yml

          echo "Logging into ECR"

          aws ecr get-login-password --region $AWS_REGION \
            | docker login --username AWS --password-stdin $REGISTRY

          echo "Updating production image versions"

          sed -i '/^BACKEND_IMAGE=/d; /^FRONTEND_IMAGE=/d' .env.production

          printf '%s\\n' \
            'BACKEND_IMAGE=$BACKEND_IMAGE' \
            'FRONTEND_IMAGE=$FRONTEND_IMAGE' \
            >> .env.production

          echo "Pulling release images"

          docker compose --env-file .env.production \
            -f docker-compose.yml \
            -f docker-compose.prod.yml pull

          echo "Starting application"

          docker compose --env-file .env.production \
            -f docker-compose.yml \
            -f docker-compose.prod.yml up -d --remove-orphans

          echo "Checking containers"

          docker inspect -f '{{.State.Running}}' guidra-prod-server | grep -qx true
          docker inspect -f '{{.State.Running}}' guidra-prod-client | grep -qx true

          echo "Release $IMAGE_TAG deployed successfully."
          EOF
          )

          # Encode the complete script as valid SSM JSON.
          COMMANDS=$(jq -n --arg script "$REMOTE_SCRIPT" \
            '{commands: [$script]}')

          # Send one command to both instances.
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_1" "$INSTANCE_2" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Guidra release $IMAGE_TAG" \
            --timeout-seconds 600 \
            --parameters "$COMMANDS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Wait for both instances and check execution results.
          for INSTANCE_ID in "$INSTANCE_1" "$INSTANCE_2"; do
            echo "Waiting for deployment on $INSTANCE_ID..."

            for ATTEMPT in {1..60}; do
              STATUS=$(aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "Status" \
                --output text 2>/dev/null || echo "Pending")

              case "$STATUS" in
                Success)
                  echo "$INSTANCE_ID deployment successful."

                  aws ssm get-command-invocation \
                    --command-id "$COMMAND_ID" \
                    --instance-id "$INSTANCE_ID" \
                    --query "StandardOutputContent" \
                    --output text

                  break
                  ;;

                Failed|Cancelled|TimedOut|Undeliverable|Terminated)
                  echo "$INSTANCE_ID deployment failed: $STATUS"

                  aws ssm get-command-invocation \
                    --command-id "$COMMAND_ID" \
                    --instance-id "$INSTANCE_ID"

                  exit 1
                  ;;

                *)
                  echo "$INSTANCE_ID status: $STATUS"
                  sleep 10
                  ;;
              esac

              if [[ "$ATTEMPT" -eq 60 ]]; then
                echo "Deployment timed out waiting for $INSTANCE_ID."
                exit 1
              fi
            done
          done

          echo "Guidra deployment completed on both EC2 instances."
