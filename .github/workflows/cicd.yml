
name: Guidra CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: guidra-production-deployment
  cancel-in-progress: false

jobs:
  lint:
    name: Lint Frontend and Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Lint client
        working-directory: client
        run: npm run lint

      - name: Lint server
        working-directory: server
        run: npm run lint

  test:
    name: Test Backend
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run backend tests
        env:
          PORT: ${{ secrets.PORT }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
        run: |
          docker compose -f docker-compose.test.yml up \
            --build \
            --exit-code-from server-test

      - name: Clean up test containers
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  publish-ecr:
    name: Build and Publish Images to AWS ECR
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read
      id-token: write

    outputs:
      registry: ${{ steps.login-ecr.outputs.registry }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/mrtuxcoder/guidra-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/mrtuxcoder/guidra-frontend:${{ github.sha }}

  publish-ghcr:
    name: Build and Publish Images to GHCR
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ghcr.io/mrtuxcoder/guidra-backend:${{ github.sha }}
            ghcr.io/mrtuxcoder/guidra-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          tags: |
            ghcr.io/mrtuxcoder/guidra-frontend:${{ github.sha }}
            ghcr.io/mrtuxcoder/guidra-frontend:latest

  deploy:
    name: Deploy Release to EC2
    runs-on: ubuntu-latest
    needs: publish-ecr

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Validate ECR images
        env:
          REGISTRY: ${{ needs.publish-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          aws ecr describe-images \
            --repository-name mrtuxcoder/guidra-backend \
            --image-ids imageTag="$IMAGE_TAG"

          aws ecr describe-images \
            --repository-name mrtuxcoder/guidra-frontend \
            --image-ids imageTag="$IMAGE_TAG"

      - name: Deploy to both EC2 instances through SSM
        env:
          REGISTRY: ${{ needs.publish-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          INSTANCE_1: ${{ vars.EC2_INSTANCE_ID_1 }}
          INSTANCE_2: ${{ vars.EC2_INSTANCE_ID_2 }}
        run: |
          set -euo pipefail

          if [[ -z "$INSTANCE_1" || -z "$INSTANCE_2" ]]; then
            echo "EC2 instance IDs are missing."
            exit 1
          fi

          BACKEND_IMAGE="$REGISTRY/mrtuxcoder/guidra-backend:$IMAGE_TAG"
          FRONTEND_IMAGE="$REGISTRY/mrtuxcoder/guidra-frontend:$IMAGE_TAG"

          COMMANDS=$(jq -n \
            --arg region "$AWS_REGION" \
            --arg registry "$REGISTRY" \
            --arg backend "$BACKEND_IMAGE" \
            --arg frontend "$FRONTEND_IMAGE" \
            --arg commit "$IMAGE_TAG" \
            '{
              commands: [
                "set -e",
                "cd /opt/guidra",

                ("curl -f -sSL https://raw.githubusercontent.com/mrtuxcoder/Guidra-learning-platform/" + $commit + "/docker-compose.yml -o docker-compose.yml"),
                ("curl -f -sSL https://raw.githubusercontent.com/mrtuxcoder/Guidra-learning-platform/" + $commit + "/docker-compose.prod.yml -o docker-compose.prod.yml"),

                ("aws ecr get-login-password --region " + $region + " | docker login --username AWS --password-stdin " + $registry),

                ("grep -q \"^BACKEND_IMAGE=\" .env.production && sed -i \"s|^BACKEND_IMAGE=.*|BACKEND_IMAGE=" + $backend + "|\" .env.production || echo \"BACKEND_IMAGE=" + $backend + "\" >> .env.production"),

                ("grep -q \"^FRONTEND_IMAGE=\" .env.production && sed -i \"s|^FRONTEND_IMAGE=.*|FRONTEND_IMAGE=" + $frontend + "|\" .env.production || echo \"FRONTEND_IMAGE=" + $frontend + "\" >> .env.production"),

                "docker compose --env-file .env.production -f docker-compose.yml -f docker-compose.prod.yml pull",

                "docker compose --env-file .env.production -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans",

                "docker inspect -f \"{{.State.Running}}\" guidra-prod-server | grep -qx true",
                "docker inspect -f \"{{.State.Running}}\" guidra-prod-client | grep -qx true",

                "echo 'Deployment completed. Both containers are running.'"
              ]
            }')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_1" "$INSTANCE_2" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Guidra release $IMAGE_TAG" \
            --parameters "$COMMANDS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for INSTANCE_ID in "$INSTANCE_1" "$INSTANCE_2"; do
            echo "Waiting for $INSTANCE_ID..."

            while true; do
              STATUS=$(aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "Status" \
                --output text 2>/dev/null || echo "Pending")

              case "$STATUS" in
                Success)
                  echo "$INSTANCE_ID deployment successful."
                  break
                  ;;
                Failed|Cancelled|TimedOut|Undeliverable|Terminated)
                  echo "$INSTANCE_ID deployment failed: $STATUS"
                  aws ssm get-command-invocation \
                    --command-id "$COMMAND_ID" \
                    --instance-id "$INSTANCE_ID"
                  exit 1
                  ;;
                *)
                  echo "Current status: $STATUS"
                  sleep 5
                  ;;
              esac
            done
          done
