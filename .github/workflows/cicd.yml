
name: Guidra CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: guidra-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # -----------------------------------------------
  # 1. LINT
  # -----------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest

    strategy:
      matrix:
        directory:
          - server
          - client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.directory }}
        run: npm ci

      - name: Run lint
        working-directory: ${{ matrix.directory }}
        run: npm run lint


  # -----------------------------------------------
  # 2. TEST
  # -----------------------------------------------
  test:
    env:
          PORT: ${{ secrets.PORT }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
    name: Backend Tests
    runs-on: ubuntu-latest
    needs:
      - lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run tests
        run: |
          docker compose \
            -f docker-compose.test.yml \
            up \
            --build \
            --exit-code-from server-test

      - name: Cleanup test containers
        if: always()
        run: |
          docker compose \
            -f docker-compose.test.yml \
            down -v --remove-orphans


  # -----------------------------------------------
  # 3. PUBLISH TO AMAZON ECR
  # -----------------------------------------------
  publish-ecr:
    name: Publish Images to Amazon ECR
    runs-on: ubuntu-latest
    needs:
      - test

    permissions:
      contents: read
      id-token: write

    outputs:
      registry: ${{ steps.login-ecr.outputs.registry }}

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_BACKEND_REPOSITORY: mrtuxcoder/guidra-backend
      ECR_FRONTEND_REPOSITORY: mrtuxcoder/guidra-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # IMPORTANT:
      # This exact step ID is used by the job output above.
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Validate ECR registry
        run: |
          set -euo pipefail

          if [[ -z "${{ steps.login-ecr.outputs.registry }}" ]]; then
            echo "::error::ECR login did not return a registry."
            exit 1
          fi

          echo "ECR registry: ${{ steps.login-ecr.outputs.registry }}"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/mrtuxcoder/guidra-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/mrtuxcoder/guidra-frontend:${{ github.sha }}

      - name: Verify published ECR images
        run: |
          set -euo pipefail

          aws ecr describe-images \
            --repository-name "$ECR_BACKEND_REPOSITORY" \
            --image-ids imageTag="${GITHUB_SHA}" \
            --region "$AWS_REGION"

          aws ecr describe-images \
            --repository-name "$ECR_FRONTEND_REPOSITORY" \
            --image-ids imageTag="${GITHUB_SHA}" \
            --region "$AWS_REGION"


  # -----------------------------------------------
  # 4. PUBLISH TO GITHUB CONTAINER REGISTRY
  # -----------------------------------------------
  publish-ghcr:
    name: Publish Images to GHCR
    runs-on: ubuntu-latest
    needs:
      - test

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/guidra-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/guidra-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/guidra-frontend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/guidra-frontend:latest


  # -----------------------------------------------
  # 5. DEPLOY TO PRODUCTION EC2 INSTANCES
  # -----------------------------------------------
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    needs:
      - publish-ecr

    permissions:
      contents: read

    concurrency:
      group: guidra-production-deployment
      cancel-in-progress: false

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      REGISTRY: ${{ needs.publish-ecr.outputs.registry }}
      IMAGE_TAG: ${{ github.sha }}
      INSTANCE_ID_1: ${{ vars.EC2_INSTANCE_ID_1 }}
      INSTANCE_ID_2: ${{ vars.EC2_INSTANCE_ID_2 }}

    steps:
      - name: Validate deployment configuration
        run: |
          set -euo pipefail

          if [[ -z "${REGISTRY:-}" ]]; then
            echo "::error::ECR registry output is empty."
            echo "Check publish-ecr job outputs and login-ecr step ID."
            exit 1
          fi

          if [[ -z "${AWS_REGION:-}" ]]; then
            echo "::error::AWS_REGION is empty."
            exit 1
          fi

          if [[ -z "${INSTANCE_ID_1:-}" || -z "${INSTANCE_ID_2:-}" ]]; then
            echo "::error::EC2 instance IDs are missing."
            exit 1
          fi

          echo "ECR registry: $REGISTRY"
          echo "AWS region: $AWS_REGION"
          echo "Image tag: $IMAGE_TAG"
          echo "Deployment targets configured."

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify ECR images before deployment
        run: |
          set -euo pipefail

          aws ecr describe-images \
            --repository-name mrtuxcoder/guidra-backend \
            --image-ids imageTag="$IMAGE_TAG"

          aws ecr describe-images \
            --repository-name mrtuxcoder/guidra-frontend \
            --image-ids imageTag="$IMAGE_TAG"

      - name: Deploy to EC2 instances using SSM
        run: |
          set -euo pipefail

          BACKEND_IMAGE="${REGISTRY}/mrtuxcoder/guidra-backend:${IMAGE_TAG}"
          FRONTEND_IMAGE="${REGISTRY}/mrtuxcoder/guidra-frontend:${IMAGE_TAG}"

          REMOTE_SCRIPT=$(cat <<EOF
          set -euo pipefail

          cd /opt/guidra

          echo "Downloading Compose files for release ${IMAGE_TAG}"

          curl -fsSL \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${IMAGE_TAG}/docker-compose.yml" \
            -o docker-compose.yml

          curl -fsSL \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${IMAGE_TAG}/docker-compose.prod.yml" \
            -o docker-compose.prod.yml

          echo "Logging in to Amazon ECR"

          aws ecr get-login-password --region ${AWS_REGION} | \
            docker login --username AWS --password-stdin ${REGISTRY}

          echo "Updating production image references"

          sed -i \
            '/^BACKEND_IMAGE=/d; /^FRONTEND_IMAGE=/d' \
            .env.production

          printf 'BACKEND_IMAGE=%s\n' '${BACKEND_IMAGE}' >> .env.production
          printf 'FRONTEND_IMAGE=%s\n' '${FRONTEND_IMAGE}' >> .env.production

          echo "Pulling release images"

          docker compose \
            -f docker-compose.yml \
            -f docker-compose.prod.yml \
            pull

          echo "Starting release"

          docker compose \
            -f docker-compose.yml \
            -f docker-compose.prod.yml \
            up -d --remove-orphans

          echo "Checking container status"

          docker inspect \
            --format='{{.State.Running}}' \
            guidra-prod-server

          docker inspect \
            --format='{{.State.Running}}' \
            guidra-prod-client

          BACKEND_RUNNING=$(docker inspect \
            --format='{{.State.Running}}' guidra-prod-server)

          FRONTEND_RUNNING=$(docker inspect \
            --format='{{.State.Running}}' guidra-prod-client)

          if [[ "$BACKEND_RUNNING" != "true" || "$FRONTEND_RUNNING" != "true" ]]; then
            echo "Deployment verification failed."
            exit 1
          fi

          echo "Deployment completed successfully."
          EOF
          )

          COMMANDS=$(jq -n --arg script "$REMOTE_SCRIPT" \
            '{commands: [$script]}')

          echo "Sending deployment command through SSM"

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "$INSTANCE_ID_1" "$INSTANCE_ID_2" \
            --parameters "$COMMANDS" \
            --comment "Guidra deployment ${IMAGE_TAG}" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Wait for each instance to complete the deployment.
          for INSTANCE_ID in "$INSTANCE_ID_1" "$INSTANCE_ID_2"; do

            echo "Waiting for instance: $INSTANCE_ID"

            STATUS="Pending"

            for ATTEMPT in $(seq 1 60); do

              sleep 10

              STATUS=$(aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "Status" \
                --output text 2>/dev/null || echo "Pending")

              echo "Attempt $ATTEMPT: $STATUS"

              case "$STATUS" in
                Success)
                  break
                  ;;
                Failed|Cancelled|TimedOut)
                  echo "::error::Deployment failed on $INSTANCE_ID"

                  aws ssm get-command-invocation \
                    --command-id "$COMMAND_ID" \
                    --instance-id "$INSTANCE_ID" \
                    --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
                    --output json || true

                  exit 1
                  ;;
              esac

            done

            if [[ "$STATUS" != "Success" ]]; then
              echo "::error::Deployment timed out on $INSTANCE_ID"

              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
                --output json || true

              exit 1
            fi

            echo "Deployment successful on $INSTANCE_ID"

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "StandardOutputContent" \
              --output text

          done

          echo "Both production instances deployed successfully."
