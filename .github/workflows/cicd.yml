
name: Guidra CI

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  # -----------------------------------------------
  # 1. LINT
  # -----------------------------------------------
  lint:
    name: Lint Frontend and Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Lint client
        working-directory: client
        run: npm run lint

      - name: Lint server
        working-directory: server
        run: npm run lint


  # -----------------------------------------------
  # 2. BACKEND TESTS
  # -----------------------------------------------
  test:
    name: Test Backend via Docker Compose
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run tests inside Docker Compose
        env:
          PORT: ${{ secrets.PORT }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
        run: |
          docker compose \
            -f docker-compose.test.yml \
            up --build --exit-code-from server-test

      - name: Cleanup test containers
        if: always()
        run: |
          docker compose \
            -f docker-compose.test.yml \
            down --remove-orphans


  # -----------------------------------------------
  # 3. PUBLISH TO AMAZON ECR
  # -----------------------------------------------
  publish-AWS-ECR:
    name: Build and publish Docker images to Amazon ECR
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    outputs:
      ecr_registry: ${{ steps.login-ecr.outputs.registry }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ECR repositories are IMMUTABLE.
      # Therefore, publish only the unique Git SHA tag.
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/mrtuxcoder/guidra-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/mrtuxcoder/guidra-frontend:${{ github.sha }}


  # -----------------------------------------------
  # 4. PUBLISH TO GITHUB CONTAINER REGISTRY
  # -----------------------------------------------
  publish-GHCR:
    name: Build and publish Docker images to GHCR
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ghcr.io/mrtuxcoder/guidra-backend:${{ github.sha }}
            ghcr.io/mrtuxcoder/guidra-backend:latest

      - name: Build and push frontend image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          tags: |
            ghcr.io/mrtuxcoder/guidra-frontend:${{ github.sha }}
            ghcr.io/mrtuxcoder/guidra-frontend:latest


  # -----------------------------------------------
  # 5. DEPLOY TO EC2 USING MATRIX
  # -----------------------------------------------
  deploy-to-ec2:
    name: Deploy to EC2
    needs:
      - publish-AWS-ECR

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        instance_id:
          - ${{ vars.EC2_INSTANCE_ID_1 }}
          - ${{ vars.EC2_INSTANCE_ID_2 }}

    concurrency:
      group: guidra-production-deployment
      cancel-in-progress: false

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Resolve ECR registry
        run: |
          set -euo pipefail

          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          REGISTRY_URI="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          echo "REGISTRY_URI=${REGISTRY_URI}" >> "$GITHUB_ENV"

          echo "Resolved ECR registry: ${REGISTRY_URI}"

      - name: Validate deployment configuration
        run: |
          set -euo pipefail

          if [[ -z "${REGISTRY_URI:-}" ]]; then
            echo "::error::Unable to resolve ECR registry."
            exit 1
          fi

          echo "Registry: $REGISTRY_URI"
          echo "Image tag: $IMAGE_TAG"
          echo "Target instance: ${{ matrix.instance_id }}"

      - name: Execute Production Deploy via AWS SSM
        env:
          INSTANCE_ID: ${{ matrix.instance_id }}
        run: |
          set -euo pipefail

          echo "Checking SSM availability for instance $INSTANCE_ID..."
          ONLINE_STATUS=$(aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
            --query "InstanceInformationList[0].PingStatus" \
            --output text 2>/dev/null || echo "NotFound")

          if [[ "$ONLINE_STATUS" != "Online" ]]; then
            echo "::warning::Instance $INSTANCE_ID is reporting status '${ONLINE_STATUS}' in AWS SSM."
            echo "::warning::Ensure the EC2 instance is in 'Running' state and has the AmazonSSMManagedInstanceCore IAM role attached."
          fi

          BACKEND_IMAGE="${REGISTRY_URI}/mrtuxcoder/guidra-backend:${IMAGE_TAG}"
          FRONTEND_IMAGE="${REGISTRY_URI}/mrtuxcoder/guidra-frontend:${IMAGE_TAG}"

          COMMANDS=$(jq -n \
            --arg region "$AWS_REGION" \
            --arg registry "$REGISTRY_URI" \
            --arg backend "$BACKEND_IMAGE" \
            --arg frontend "$FRONTEND_IMAGE" \
            --arg commit "$IMAGE_TAG" \
            --arg repo "$GITHUB_REPOSITORY" \
            '{
              commands: [
                "set -e",
                "cd /opt/guidra",
                ("curl -f -sSL https://raw.githubusercontent.com/" + $repo + "/" + $commit + "/docker-compose.yml -o docker-compose.yml"),
                ("curl -f -sSL https://raw.githubusercontent.com/" + $repo + "/" + $commit + "/docker-compose.prod.yml -o docker-compose.prod.yml"),
                ("aws ecr get-login-password --region " + $region + " | sudo docker login --username AWS --password-stdin " + $registry),
                ("sudo sed -i \"/^BACKEND_IMAGE=/d; /^FRONTEND_IMAGE=/d\" .env.production 2>/dev/null || true"),
                ("printf \"BACKEND_IMAGE=%s\\n\" \"" + $backend + "\" | sudo tee -a .env.production > /dev/null"),
                ("printf \"FRONTEND_IMAGE=%s\\n\" \"" + $frontend + "\" | sudo tee -a .env.production > /dev/null"),
                "sudo docker compose --env-file .env.production -f docker-compose.yml -f docker-compose.prod.yml pull",
                "sudo docker compose --env-file .env.production -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans",
                "sudo docker inspect -f \"{{.State.Running}}\" guidra-prod-server | grep -qx true",
                "sudo docker inspect -f \"{{.State.Running}}\" guidra-prod-client | grep -qx true",
                "sudo docker system prune -af"
              ]
            }')

          echo "Sending SSM command to $INSTANCE_ID"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Guidra deployment ${IMAGE_TAG}" \
            --parameters "$COMMANDS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Wait for this instance's deployment.
          STATUS="Pending"

          for ATTEMPT in $(seq 1 60); do
            sleep 10

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Attempt $ATTEMPT: $STATUS"

            case "$STATUS" in
              Success)
                break
                ;;
              Failed|Cancelled|TimedOut)
                echo "::error::Deployment failed on $INSTANCE_ID"

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
                  --output json || true

                exit 1
                ;;
            esac
          done

          if [[ "$STATUS" != "Success" ]]; then
            echo "::error::Deployment timed out on $INSTANCE_ID"

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
              --output json || true

            exit 1
          fi

          echo "Deployment succeeded on $INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text
