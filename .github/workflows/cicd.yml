name: Guidra CI/CD & Infrastructure

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      apply_infra:
        description: "Run 'terraform apply' to provision/update AWS infrastructure"
        required: true
        type: boolean
        default: false
      deploy_app:
        description: "Deploy application to EC2 via AWS SSM"
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write
  packages: write

jobs:

  # -----------------------------------------------
  # 1. CODE QUALITY & LINT
  # -----------------------------------------------
  lint:
    name: Lint Frontend and Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Lint client
        working-directory: client
        run: npm run lint

      - name: Lint server
        working-directory: server
        run: npm run lint

  # -----------------------------------------------
  # 2. BACKEND TESTS
  # -----------------------------------------------
  test:
    name: Test Backend via Docker Compose
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run tests inside Docker Compose
        env:
          PORT: ${{ secrets.PORT || '5000' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
        run: |
          docker compose \
            -f docker-compose.test.yml \
            up --build --exit-code-from server-test

      - name: Cleanup test containers
        if: always()
        run: |
          docker compose \
            -f docker-compose.test.yml \
            down --remove-orphans

  # -----------------------------------------------
  # 3. TERRAFORM INFRASTRUCTURE PROVISIONING
  # -----------------------------------------------
  terraform:
    name: Terraform Infrastructure
    runs-on: ubuntu-latest
    needs: test
    outputs:
      instance_ids: ${{ steps.tf_outputs.outputs.instance_ids }}
      alb_dns: ${{ steps.tf_outputs.outputs.alb_dns }}
      alb_url: ${{ steps.tf_outputs.outputs.alb_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-south-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -no-color

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && (github.event.inputs.apply_infra == 'true')
        working-directory: terraform
        run: terraform apply -auto-approve

      - name: Extract Terraform Outputs
        id: tf_outputs
        if: always()
        working-directory: terraform
        run: |
          set -e
          if [ -f terraform.tfstate ] && terraform output -json > /dev/null 2>&1; then
            INSTANCES=$(terraform output -json instance_ids 2>/dev/null | jq -c . || echo '[]')
            ALB_DNS=$(terraform output -raw load_balancer_dns_name 2>/dev/null || echo '')
            ALB_URL=$(terraform output -raw load_balancer_url 2>/dev/null || echo '')
            echo "instance_ids=$INSTANCES" >> $GITHUB_OUTPUT
            echo "alb_dns=$ALB_DNS" >> $GITHUB_OUTPUT
            echo "alb_url=$ALB_URL" >> $GITHUB_OUTPUT
          else
            echo "instance_ids=[]" >> $GITHUB_OUTPUT
            echo "alb_dns=" >> $GITHUB_OUTPUT
            echo "alb_url=" >> $GITHUB_OUTPUT
          fi

  # -----------------------------------------------
  # 4. PUBLISH DOCKER IMAGES TO AMAZON ECR
  # -----------------------------------------------
  publish-AWS-ECR:
    name: Build & Publish to Amazon ECR
    runs-on: ubuntu-latest
    needs:
      - test
      - terraform
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event.inputs.deploy_app == 'true')
    outputs:
      ecr_registry: ${{ steps.login-ecr.outputs.registry }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-south-1' }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/mrtuxcoder/guidra-backend:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/mrtuxcoder/guidra-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/mrtuxcoder/guidra-frontend:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/mrtuxcoder/guidra-frontend:latest

  # -----------------------------------------------
  # 5. DEPLOY TO EC2 INSTANCES VIA AWS SSM
  # -----------------------------------------------
  deploy-to-ec2:
    name: Deploy to EC2 Servers
    runs-on: ubuntu-latest
    needs:
      - publish-AWS-ECR
      - terraform
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event.inputs.deploy_app == 'true')
    strategy:
      fail-fast: false
      matrix:
        instance_id:
          - ${{ vars.EC2_INSTANCE_ID_1 || 'i-0964007212994913c' }}
          - ${{ vars.EC2_INSTANCE_ID_2 || 'i-0c4a2b8ac6117cbf7' }}

    concurrency:
      group: guidra-production-deployment-${{ matrix.instance_id }}
      cancel-in-progress: false

    env:
      AWS_REGION: ${{ secrets.AWS_REGION || 'ap-south-1' }}
      REGISTRY_URI: ${{ needs.publish-AWS-ECR.outputs.ecr_registry }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check Instance SSM Status
        env:
          INSTANCE_ID: ${{ matrix.instance_id }}
        run: |
          set -euo pipefail
          echo "Checking SSM availability for instance $INSTANCE_ID..."
          ONLINE_STATUS=$(aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
            --query "InstanceInformationList[0].PingStatus" \
            --output text 2>/dev/null || echo "NotFound")

          if [[ "$ONLINE_STATUS" != "Online" ]]; then
            echo "::warning::Instance $INSTANCE_ID reports status '$ONLINE_STATUS' in AWS SSM."
          fi

      - name: Execute Deployment Commands via AWS SSM
        env:
          INSTANCE_ID: ${{ matrix.instance_id }}
        run: |
          set -euo pipefail

          BACKEND_IMAGE="${REGISTRY_URI}/mrtuxcoder/guidra-backend:${IMAGE_TAG}"
          FRONTEND_IMAGE="${REGISTRY_URI}/mrtuxcoder/guidra-frontend:${IMAGE_TAG}"

          COMMANDS=$(jq -n \
            --arg region "$AWS_REGION" \
            --arg registry "$REGISTRY_URI" \
            --arg backend "$BACKEND_IMAGE" \
            --arg frontend "$FRONTEND_IMAGE" \
            --arg commit "$IMAGE_TAG" \
            --arg repo "$GITHUB_REPOSITORY" \
            '{
              commands: [
                "set -euo pipefail",
                "cd /opt/guidra",
                ("curl -fsSL https://raw.githubusercontent.com/" + $repo + "/" + $commit + "/docker-compose.yml -o docker-compose.yml"),
                ("curl -fsSL https://raw.githubusercontent.com/" + $repo + "/" + $commit + "/docker-compose.prod.yml -o docker-compose.prod.yml"),
                ("aws ecr get-login-password --region " + $region + " | docker login --username AWS --password-stdin " + $registry),
                "if [ -f /opt/guidra/sync-secrets.sh ]; then /opt/guidra/sync-secrets.sh; fi",
                ("sed -i \"/^BACKEND_IMAGE=/d; /^FRONTEND_IMAGE=/d\" .env.production 2>/dev/null || true"),
                ("printf \"BACKEND_IMAGE=%s\\n\" \"" + $backend + "\" >> .env.production"),
                ("printf \"FRONTEND_IMAGE=%s\\n\" \"" + $frontend + "\" >> .env.production"),
                "docker compose --env-file .env.production -f docker-compose.yml -f docker-compose.prod.yml pull",
                "docker compose --env-file .env.production -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans",
                "docker inspect -f \"{{.State.Running}}\" guidra-prod-server | grep -qx true",
                "docker inspect -f \"{{.State.Running}}\" guidra-prod-client | grep -qx true",
                "docker system prune -af"
              ]
            }')

          echo "Dispatching deployment to $INSTANCE_ID..."
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Guidra deployment ${IMAGE_TAG}" \
            --parameters "$COMMANDS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Wait for deployment execution
          STATUS="Pending"
          for ATTEMPT in $(seq 1 60); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Attempt $ATTEMPT: $STATUS"

            case "$STATUS" in
              Success)
                break
                ;;
              Failed|Cancelled|TimedOut)
                echo "::error::Deployment failed on $INSTANCE_ID"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
                  --output json || true
                exit 1
                ;;
            esac
          done

          if [[ "$STATUS" != "Success" ]]; then
            echo "::error::Deployment timed out on $INSTANCE_ID"
            exit 1
          fi

          echo "Deployment successfully completed on $INSTANCE_ID"

  # -----------------------------------------------
  # 6. POST-DEPLOYMENT HEALTH SMOKE TEST
  # -----------------------------------------------
  smoke-test:
    name: ALB Health Smoke Test
    runs-on: ubuntu-latest
    needs: deploy-to-ec2
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-south-1' }}

      - name: Verify ALB Target Health
        run: |
          set -euo pipefail
          echo "Checking ALB target health..."
          TG_ARN=$(aws elbv2 describe-target-groups \
            --names "guidra-app" \
            --query "TargetGroups[0].TargetGroupArn" \
            --output text 2>/dev/null || echo "")

          if [[ -n "$TG_ARN" ]]; then
            aws elbv2 describe-target-health --target-group-arn "$TG_ARN"
          else
            echo "Target group guidra-app not found or dynamically managed."
          fi
