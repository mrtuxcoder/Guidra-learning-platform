services:
  mongodb:
    container_name: guidra-dev-mongodb

  backend:
    container_name: guidra-dev-server
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file:
      - ./.env.development
    ports:
      - "${BACKEND_PORT:-5000}:5000"

  frontend:
    container_name: guidra-dev-client
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-80}:80"
