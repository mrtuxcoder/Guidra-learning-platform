services:
  mongodb:
    image: mongo:7.0
    container_name: guidra-dev-mongodb
    restart: unless-stopped
    networks:
      - guidra-network
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' localhost:27017/test | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    container_name: guidra-dev-server
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file:
      - ./.env.development
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    container_name: guidra-dev-client
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-80}:80"

volumes:
  mongodb_data:
