services:
  mongodb:
    image: mongo:7.0
    container_name: guidra-mongodb
    restart: unless-stopped
    networks:
      - guidra-network
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' localhost:27017/test | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: guidra-server:latest
    container_name: guidra-server
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file:
      - ./server/.env.development
    environment:
      NODE_ENV: development
      CLIENT_URL: http://localhost
      CLIENT_ORIGIN: http://localhost
      FRONTEND_URL: http://localhost
      GOOGLE_CALLBACK_URL: http://localhost:5000/api/v1/auth/google/callback
    ports:
      - "5000:5000"
    networks:
      - guidra-network
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    image: guidra-client:latest
    container_name: guidra-client
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:5000
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - guidra-network
    depends_on:
      - backend

networks:
  guidra-network:
    driver: bridge

volumes:
  mongodb_data:

