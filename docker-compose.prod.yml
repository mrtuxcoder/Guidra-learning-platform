services:
  backend:
    container_name: guidra-prod-server
    image: ${BACKEND_IMAGE}
    env_file:
      - ./.env.production
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    restart: unless-stopped
    networks:
      - guidra-network

  frontend:
    container_name: guidra-prod-client
    image: ${FRONTEND_IMAGE}
    ports:
      - "${FRONTEND_PORT:-80}:80"
    restart: unless-stopped
    networks:
      - guidra-network
    depends_on:
      - backend

networks:
  guidra-network:
    driver: bridge
